plugins {
    id 'com.android.application'
}

def qfsKeystore = System.getenv("QFS_KEYSTORE")
def qfsAlias = System.getenv("QFS_KEY_ALIAS")
def qfsPassword = System.getenv("QFS_KEY_PASSWORD")

android {
    namespace 'com.quickfilestudio.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.quickfilestudio.app"
        minSdk 23
        targetSdk 35
        versionCode 126
        versionName "1.2.6"
    }

    def qfsSigningProps = new Properties()
    def qfsSigningFile = file(System.getProperty("user.home") + "/.qfs-signing.properties")
    if (qfsSigningFile.exists()) {
        qfsSigningProps.load(new FileInputStream(qfsSigningFile))
    }

    signingConfigs {
        release {
            storeFile file(qfsSigningProps.getProperty("storeFile"))
            storePassword qfsSigningProps.getProperty("storePassword")
            keyAlias qfsSigningProps.getProperty("keyAlias", "quickfilestudio")
            keyPassword qfsSigningProps.getProperty("keyPassword")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
